status = error
name = SparkLog4j2

# Console appender config
appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c: %m%n

# Root logger config
rootLogger.level = error
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = console

# Explicit suppression of verbose loggers
logger.spark.name = org.apache.spark
logger.spark.level = error

logger.sparkui.name = org.apache.spark.ui
logger.sparkui.level = error

logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = error

logger.storage.name = org.apache.spark.storage
logger.storage.level = error

logger.executor.name = org.apache.spark.executor
logger.executor.level = error

logger.deploy.name = org.apache.spark.deploy
logger.deploy.level = error

logger.sql.name = org.apache.spark.sql
logger.sql.level = error

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error

logger.jetty.name = org.spark_project.jetty
logger.jetty.level = error

logger.netty.name = io.netty
logger.netty.level = error

logger.broadcast.name = org.apache.spark.broadcast.TorrentBroadcast
logger.broadcast.level = error

logger.utils.name = org.apache.spark.util
logger.utils.level = error

logger.rpc.name = org.apache.spark.rpc
logger.rpc.level = error
