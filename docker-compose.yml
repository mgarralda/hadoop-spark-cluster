services:
  master:
    image: "spark_master:latest"
    container_name: spark-cluster-master
    hostname: spark-cluster-master
    healthcheck:
      test: ["CMD", "bash", "-c", "jps -l | grep -q org.apache.spark.deploy.history.HistoryServer && hdfs dfs -test -d /shared/spark-logs"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s
    stop_grace_period: 30s
    ports:
      # Spark Master (cluster communication)
      - "127.0.0.1:7077:7077"
      # Spark Application UI
      - "127.0.0.1:4040:4040"
      - "127.0.0.1:4041:4041"
      # Spark History Server
      - "127.0.0.1:18080:18080"
      # Spark Standalone UI
      - "127.0.0.1:8080:8080"

      # YARN ResourceManager UI
      - "127.0.0.1:8088:8088"

      # HDFS (NameNode)
      - "127.0.0.1:9870:9870"

      # MapReduce Job History
      # JobHistory Web UI
      - "127.0.0.1:19888:19888"

      # SSH (optional)
      - "127.0.0.1:2222:22"
    networks:
      spark-network:
        ipv4_address: 172.18.0.20
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 4g
    volumes:
      - namenode-data:/home/sparker/hadoop_data/hdfs/namenode
      - ./shared-master:/home/sparker/shared
      - hibench-data:/home/sparker/HiBench

  slave1:
    image: spark_slave:latest
    container_name: spark-cluster-slave-1
    hostname: spark-cluster-slave-1
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "jps -l | grep -q org.apache.spark.deploy.worker.Worker && jps -l | grep -q org.apache.hadoop.yarn.server.nodemanager.NodeManager && jps -l | grep -q org.apache.hadoop.hdfs.server.datanode.DataNode"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    environment:
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_MEMORY=3g
    networks:
      spark-network:
        ipv4_address: 172.18.0.11
    depends_on:
      - master
    extra_hosts:
      - "spark-cluster-master:172.18.0.20"
    volumes:
      - datanode-1-data:/home/sparker/hadoop_data/hdfs/datanode
      - ./shared-slave:/home/sparker/shared
      - hibench-data:/home/sparker/HiBench
    deploy:
      resources:
        limits:
          cpus: 6
          memory: 6g

  slave2:
    image: spark_slave:latest
    container_name: spark-cluster-slave-2
    hostname: spark-cluster-slave-2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "jps -l | grep -q org.apache.spark.deploy.worker.Worker && jps -l | grep -q org.apache.hadoop.yarn.server.nodemanager.NodeManager && jps -l | grep -q org.apache.hadoop.hdfs.server.datanode.DataNode"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    environment:
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_MEMORY=3g
    networks:
      spark-network:
        ipv4_address: 172.18.0.12
    depends_on:
      - master
    extra_hosts:
      - "spark-cluster-master:172.18.0.20"
    volumes:
      - datanode-2-data:/home/sparker/hadoop_data/hdfs/datanode
      - ./shared-slave:/home/sparker/shared
      - hibench-data:/home/sparker/HiBench
    deploy:
      resources:
        limits:
          cpus: 6
          memory: 6g

  slave3:
    image: spark_slave:latest
    container_name: spark-cluster-slave-3
    hostname: spark-cluster-slave-3
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "jps -l | grep -q org.apache.spark.deploy.worker.Worker && jps -l | grep -q org.apache.hadoop.yarn.server.nodemanager.NodeManager && jps -l | grep -q org.apache.hadoop.hdfs.server.datanode.DataNode"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    environment:
      - SPARK_WORKER_CORES=6
      - SPARK_WORKER_MEMORY=3g
    networks:
      spark-network:
        ipv4_address: 172.18.0.13
    depends_on:
      - master
    extra_hosts:
      - "spark-cluster-master:172.18.0.20"
    volumes:
      - datanode-3-data:/home/sparker/hadoop_data/hdfs/datanode
      - ./shared-slave:/home/sparker/shared
      - hibench-data:/home/sparker/HiBench
    deploy:
      resources:
        limits:
          cpus: 6
          memory: 6g

  nginx:
    image: nginx:latest
    container_name: spark-cluster-proxy
    hostname: spark-cluster-proxy
    ports:
      # All slave UIs
      - "127.0.0.1:8042:8042"
      # All HDFS DataNodes UIs
      - "127.0.0.1:9864:9864"
      # All Spark standalone workers UIs
      - "127.0.0.1:8081:8081"
    networks:
      - spark-network
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  jupyterlab:
    image: spark_jupyter
    container_name: spark-cluster-jupyterlab
    hostname: spark-cluster-jupyterlab
    mem_limit: 4g
    cpus: 2
    environment:
      - SPARK_MASTER=spark://spark-cluster-master:7077
      - PYSPARK_PYTHON=/opt/pyspark/bin/python
      - PYSPARK_DRIVER_PYTHON=/opt/notebook/bin/python
    volumes:
      - ./jupyter:/home/jovyan/work
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4042:4040"
      - "127.0.0.1:4043:4041"
    networks:
      spark-network:
        ipv4_address: 172.18.0.21
    depends_on:
      master:
        condition: service_healthy


networks:
  spark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  hibench-data:
  namenode-data:
  datanode-1-data:
  datanode-2-data:
  datanode-3-data:
